<div class="app-layout" [class.collapsed]="isSidebarCollapsed">
  <app-header (toggle)="toggleSidebar()"></app-header>

  <div class="mobile-overlay" *ngIf="isMobile && showMobileSidebar" (click)="toggleSidebar()"></div>

  <div class="main">
    <app-sidebar class="sidebar" [class.mobile-visible]="isMobile && showMobileSidebar"
      [isCollapsed]="isSidebarCollapsed && !isMobile">
    </app-sidebar>

    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
